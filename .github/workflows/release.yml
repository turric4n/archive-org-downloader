name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY: archive_downloader

jobs:
  build-windows:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 with MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Build
        run: |-
          mkdir -p build-win
          mingw32-make -f Makefile.win CC=gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive_downloader-windows
          path: ${{ env.BINARY }}.exe

  build-linux:
    name: Build Linux (libcurl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Build
        run: |-
          make CC=gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive_downloader-linux
          path: ${{ env.BINARY }}

  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Rename binaries
        shell: bash
        run: |-
          ls -la artifacts/
          mkdir -p release
          mv artifacts/${{ env.BINARY }}.exe release/${{ env.BINARY }}-windows-x64.exe
          mv artifacts/${{ env.BINARY }} release/${{ env.BINARY }}-linux-x64
          chmod +x release/*
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ github.ref_name }}
          name: archive_downloader ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true