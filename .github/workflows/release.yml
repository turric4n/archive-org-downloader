name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY: archive_downloader

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        shell: bash
        id: tag
        run: |-
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${{ github.ref_name }}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
            if [[ -z "$latest" ]]; then
              ver="v1.0.0"
            else
              IFS='.' read -r maj min pat <<< "${latest#v}"
              ver="v${maj}.${min}.$((pat+1))"
            fi
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: Configure (Visual Studio)
        shell: bash
        run: |-
          cmake -S . -B build \
            -G "Visual Studio 17 2022" -A x64 \
            -DVERSION="${{ steps.tag.outputs.ver }}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        shell: bash
        run: ./build/Release/unit_test.exe

      - name: Run integration tests
        shell: bash
        run: |-
          mkdir -p build-test
          bash tests/integration_test.sh ./build/Release/archive_downloader.exe \
              ./build-test/dest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive_downloader-windows
          path: build/Release/${{ env.BINARY }}.exe

  build-linux:
    name: Build Linux (libcurl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        shell: bash
        id: tag
        run: |-
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${{ github.ref_name }}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
            if [[ -z "$latest" ]]; then
              ver="v1.0.0"
            else
              IFS='.' read -r maj min pat <<< "${latest#v}"
              ver="v${maj}.${min}.$((pat+1))"
            fi
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: Install dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev tar zip

      - name: Build
        run: |-
          make CC=gcc VERSION="${{ steps.tag.outputs.ver }}"

      - name: Run unit tests
        run: make CC=gcc test-unit

      - name: Run integration tests
        run: make CC=gcc test-integration

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive_downloader-linux
          path: ${{ env.BINARY }}

  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        shell: bash
        id: tag
        run: |-
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${{ github.ref_name }}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
            if [[ -z "$latest" ]]; then
              ver="v1.0.0"
            else
              IFS='.' read -r maj min pat <<< "${latest#v}"
              ver="v${maj}.${min}.$((pat+1))"
            fi
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package archives
        shell: bash
        run: |-
          set -e
          ver="${{ steps.tag.outputs.ver }}"
          mkdir -p release

          # Linux: uniform inner name 'archive_downloader' at archive root
          tar -C artifacts -czf release/${BINARY}-${ver}-linux-x86_64.tar.gz ${BINARY}

          # Windows: uniform inner name 'archive_downloader.exe' in a .zip
          (cd artifacts && zip ../release/${BINARY}-${ver}-windows-x86_64.zip ${BINARY}.exe)

          echo "--- archives ---"
          ls -la release/

      - name: Generate checksums
        shell: bash
        run: |-
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ steps.tag.outputs.ver }}
          name: ${{ env.BINARY }} ${{ steps.tag.outputs.ver }}
          generate_release_notes: true
          fail_on_unmatched_files: true